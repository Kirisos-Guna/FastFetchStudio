name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name FastFetchStudio
          --hidden-import tkinter --hidden-import PIL --hidden-import PIL.ImageTk
          --collect-submodules PIL app.py

      - name: Smoke test (headless selftest)
        run: .\dist\FastFetchStudio.exe --selftest

      - name: Smoke test (GUI build + apply)
        run: .\dist\FastFetchStudio.exe --smoke-gui

      # Tk does not clamp the canvas origin when the scroll region is shorter
      # than the viewport, so a wheel-up nudge with nothing to scroll to used to
      # push the tab content down the card behind a blank band. Guarded because
      # it is invisible to yview() and trivial to reintroduce.
      - name: Scroll origin stays inside the scroll region
        run: .\dist\FastFetchStudio.exe --smoke-scroll

      # Icons come from fastfetch's per-type keyIcon default, not from a glyph
      # typed into each key. A hand-maintained glyph list drifted and left 6 of
      # 14 rows label-only. This runner has no fastfetch, so only the config
      # shape is checked here; verify-setup does the render check.
      - name: Every module has an icon
        run: .\dist\FastFetchStudio.exe --smoke-icons

      # The launcher runs on every shell start, so its behaviour is worth
      # pinning: it must draw fastfetch exactly once, and 'once per day' must
      # actually throttle. Both were broken before v1.1.5.
      - name: Launcher draws fastfetch exactly once
        shell: pwsh
        run: |
          python -c "import app; app.generate_launcher({'logWidth':28,'logHeight':24})"
          $launcher = Join-Path $env:USERPROFILE '.config\fastfetch\fastfetch-random.ps1'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'app.py did not write a launcher' }

          # Fixtures: the image branch only runs when a .sixel exists, and the
          # retry-on-failure only happens inside that branch. Without one, every
          # case takes the no-image path and the retry is never exercised.
          $sixels = Join-Path $env:USERPROFILE '.config\fastfetch\sixels'
          $arts   = Join-Path $env:USERPROFILE '.config\fastfetch\arts'
          New-Item -ItemType Directory -Path $sixels -Force | Out-Null
          New-Item -ItemType Directory -Path $arts -Force | Out-Null
          # A real ladder, written by the app's own encoder. The launcher chooses
          # which file to draw by reading each sixel's raster header, so a fixture
          # that is not a sixel only exercises the failure path.
          python tools/make-logo-fixtures.py --sixel-dir $sixels --art-dir $arts --name demo
          $themes = Join-Path $env:USERPROFILE '.config\fastfetch\themes'
          New-Item -ItemType Directory -Path $themes -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $themes 'theme-01.jsonc') -Value '{"modules":[]}'

          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($launcher, [ref]$null, [ref]$errs)
          if (@($errs).Count) { throw "launcher has syntax errors: $($errs[0].Message)" }
          Write-Host 'launcher parses cleanly'

          # Every draw - the first one and the repair after a resize - goes
          # through one function, so there is exactly one line to replace. The
          # log write also models the exe's exit code: swapping in a bare cmdlet
          # would leave $LASTEXITCODE unset, and "$null -ne 0" is TRUE in
          # PowerShell - which is precisely how the fallback came to fire on a
          # successful run.
          $probe = Join-Path $env:TEMP 'launcher-probe.ps1'
          $inv   = Join-Path $env:TEMP 'launcher-inv.txt'
          $log   = "Add-Content -LiteralPath '$inv' -Value 'run'`n`$global:LASTEXITCODE = [int]`$env:FF_RC"
          $src = Get-Content -LiteralPath $launcher -Raw
          $src = $src.Replace('& $Plan.Exe @a', $log)
          # The swap matches the whole invocation, so renaming its variables or
          # moving the call silently stops it matching - and the leftover text is
          # a *parse* error in the probe, which then surfaces as some unrelated
          # assertion failing. Fail here instead.
          if ($src -match '& \$Plan\.Exe') { throw 'the launcher invocation was not swapped out for the probe' }
          Set-Content -LiteralPath $probe -Value $src

          function Count-Runs([int]$rc) {
            $env:FF_RC = $rc
            # Each call models a fresh shell, so clear the once-per-session guard
            # the launcher now keeps - otherwise every call after the first
            # would be suppressed and every count would read 0.
            $global:FastFetchStudioDrawn = $false
            Remove-Item -LiteralPath $inv -Force -ErrorAction SilentlyContinue
            & $probe | Out-Null
            if (Test-Path -LiteralPath $inv) { return @(Get-Content -LiteralPath $inv).Count }
            return 0
          }

          # The runner has no fastfetch. That is the fresh-machine case the
          # launcher is meant to explain rather than fail silently on, so pin
          # PATH to System32 and assert it draws nothing but does speak up.
          Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue
          Remove-Item Env:\TERM_PROGRAM -ErrorAction SilentlyContinue
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:FF_RC = 0
          Remove-Item -LiteralPath $inv -Force -ErrorAction SilentlyContinue
          # Write-Host goes to the information stream, so 2>&1 would capture
          # nothing; *>&1 is what actually surfaces the message.
          $msg = & $probe *>&1 | Out-String
          $missing = if (Test-Path -LiteralPath $inv) { @(Get-Content -LiteralPath $inv).Count } else { 0 }
          $env:PATH = $savedPath
          if ($missing -ne 0) { throw "launcher drew $missing times with no fastfetch installed" }
          if ($msg -notmatch 'was not found') { throw "missing fastfetch produced no explanation: $msg" }
          Write-Host 'missing-fastfetch path ok (0 invocations, explained)'

          # Give it a stub so $ffExe resolves. The probe never executes it -
          # the invocations are replaced by log writes - it only has to exist.
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'fastfetch.exe') -Value '' -NoNewline

          foreach ($case in @('conhost', 'windows-terminal')) {
            if ($case -eq 'windows-terminal') { $env:WT_SESSION = 'ci' }
            else { Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue }
            Remove-Item Env:\TERM_PROGRAM -ErrorAction SilentlyContinue
            $n = Count-Runs 0
            Write-Host "$case -> $n invocation(s)"
            if ($n -ne 1) { throw "launcher invoked fastfetch $n times in the '$case' case; must be exactly 1" }
          }

          # A failing image attempt retries exactly once; the no-image path has
          # no retry at all.
          $env:WT_SESSION = 'ci'
          $failImg = Count-Runs 1
          if ($failImg -ne 2) { throw "failed image attempt drew $failImg times, expected 2 (try + retry)" }
          Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue
          $failPlain = Count-Runs 1
          if ($failPlain -ne 1) { throw "conhost fallback drew $failPlain times, expected 1" }
          Write-Host "retry ok (image=$failImg conhost=$failPlain)"

          # 'once per day' must write its day stamp and then hold for the rest of the day.
          $gui = Join-Path $env:USERPROFILE '.config\fastfetch\gui'
          New-Item -ItemType Directory -Path $gui -Force | Out-Null
          $stamp = Join-Path $gui '.last-random-run'
          Set-Content -LiteralPath (Join-Path $gui 'studio-state.json') -Value '{"frequency":"daily"}'
          Remove-Item -LiteralPath $stamp -Force -ErrorAction SilentlyContinue
          $first = Count-Runs 0
          if ($first -ne 1) { throw "daily run drew $first times, expected 1" }
          if (-not (Test-Path -LiteralPath $stamp)) { throw 'daily run did not write the day stamp' }
          $second = Count-Runs 0
          if ($second -ne 0) { throw "daily frequency drew again the same day ($second invocations)" }
          Write-Host "daily ok (first=$first second=$second)"

          # A profile can hold two fastfetch calls - setup.ps1's managed block
          # plus the documented snippet pasted in afterwards - and the user then
          # sees the fetch twice, each with its own random theme. Unlike
          # Count-Runs this deliberately does NOT reset the guard, so it models
          # two calls in one shell.
          # The daily test above left frequency=daily plus a today-dated stamp,
          # which would return before drawing anything at all.
          Set-Content -LiteralPath (Join-Path $gui 'studio-state.json') `
                       -Value '{"randomLogo":false,"defaultImage":"demo.png"}'
          Remove-Item -LiteralPath $stamp -Force -ErrorAction SilentlyContinue
          $global:FastFetchStudioDrawn = $false
          $env:FF_RC = 0
          Remove-Item -LiteralPath $inv -Force -ErrorAction SilentlyContinue
          & $probe | Out-Null
          & $probe | Out-Null
          $twice = if (Test-Path -LiteralPath $inv) { @(Get-Content -LiteralPath $inv).Count } else { 0 }
          if ($twice -ne 1) { throw "two calls in one shell drew $twice times, expected 1" }
          Write-Host 'once-per-session guard ok (2 calls in one shell -> 1 draw)'

      # The launcher can only guess whether a terminal renders images, and a
      # wrong guess used to swap a chosen logo for the built-in ASCII one with
      # no explanation and no way out. Pin the branch each host takes, and pin
      # the escape hatch.
      - name: Logo mode picks the right branch
        shell: pwsh
        run: |
          python -c "import app; app.generate_launcher({'logWidth':28,'logHeight':24})"
          $root = Join-Path $env:USERPROFILE '.config\fastfetch'
          $launcher = Join-Path $root 'fastfetch-random.ps1'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'app.py did not write a launcher' }

          # Every branch needs its asset folder to exist.
          foreach ($d in 'sixels', 'pngs', 'themes', 'gui', 'arts') {
            New-Item -ItemType Directory -Path (Join-Path $root $d) -Force | Out-Null
          }
          # Real fixtures: the launcher chooses between the ladder's files by
          # reading their rasters, so a stub sixel only tests the failure path.
          python tools/make-logo-fixtures.py --sixel-dir (Join-Path $root 'sixels') --art-dir (Join-Path $root 'arts') --name demo
          Set-Content -LiteralPath (Join-Path $root 'pngs\demo.png') -Value 'x' -NoNewline
          Set-Content -LiteralPath (Join-Path $root 'themes\theme-01.jsonc') -Value '{"modules":[]}'
          # A pinned logo is what makes the fallback explain itself. No
          # 'frequency' key on purpose: the previous step left a today-dated
          # day stamp behind, and 'daily' would return before drawing anything.
          Set-Content -LiteralPath (Join-Path $root 'gui\studio-state.json') `
                       -Value '{"randomLogo":false,"defaultImage":"demo.png"}'

          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'fastfetch.exe') -Value '' -NoNewline

          # Counting invocations cannot tell a sixel draw from the block art
          # from the ASCII fallback, and there is one invocation site now, so the
          # probe logs the arguments it was handed and the cases match on those.
          $probe = Join-Path $env:TEMP 'logo-probe.ps1'
          $src = Get-Content -LiteralPath $launcher -Raw
          $src = $src.Replace('& $Plan.Exe @a',
                              "Add-Content -LiteralPath `$env:FF_LOG -Value (`$a -join ' ')")
          Set-Content -LiteralPath $probe -Value $src
          # The branch each host takes must not depend on how wide the runner's
          # own console happens to be: 80 columns leaves room 29, which holds the
          # configured 28x24 logo (and its 28x24 block art).
          $pin = $src.Replace('[Console]::WindowWidth', '80').Replace('[Console]::WindowHeight', '42')
          $pinned = Join-Path $env:TEMP 'logo-probe-pinned.ps1'
          Set-Content -LiteralPath $pinned -Value $pin

          $saved = @('WT_SESSION', 'TERM_PROGRAM', 'WEZTERM_PANE', 'KITTY_WINDOW_ID', 'TERM', 'FASTFETCH_STUDIO_LOGO')

          function Clear-Term {
            foreach ($k in $saved) { Remove-Item "Env:\$k" -ErrorAction SilentlyContinue }
          }

          function Get-Branch([hashtable]$overrides, [string]$Script = $pinned) {
            Clear-Term
            # Each case models a fresh shell.
            $global:FastFetchStudioDrawn = $false
            foreach ($k in $overrides.Keys) { Set-Item "Env:\$k" $overrides[$k] }
            $env:FF_LOG = Join-Path $env:TEMP 'logo-log.txt'
            Remove-Item -LiteralPath $env:FF_LOG -Force -ErrorAction SilentlyContinue
            & $Script *>&1 | Out-Null
            if (Test-Path -LiteralPath $env:FF_LOG) { return (Get-Content -LiteralPath $env:FF_LOG) -join ',' }
            return 'none'
          }

          $cases = @(
            @{ name = 'conhost -> block art';        over = @{};                                       want = 'arts\demo.art' },
            @{ name = 'windows-terminal';            over = @{ WT_SESSION = 'ci' };                     want = '--logo-type raw' },
            @{ name = 'wezterm';                     over = @{ TERM_PROGRAM = 'WezTerm' };             want = '--logo-type raw' },
            @{ name = 'kitty';                       over = @{ KITTY_WINDOW_ID = '1' };                want = '--logo-type kitty-direct' },
            @{ name = 'foot';                        over = @{ TERM = 'foot' };                        want = '--logo-type raw' },
            @{ name = 'vs code (no image support)';  over = @{ TERM_PROGRAM = 'vscode' };              want = 'arts\demo.art' },
            @{ name = 'forced builtin in wt';        over = @{ WT_SESSION = 'ci'; FASTFETCH_STUDIO_LOGO = 'builtin' }; want = '--logo Windows11' },
            @{ name = 'forced image on conhost';     over = @{ FASTFETCH_STUDIO_LOGO = 'image' };      want = '--logo-type raw' }
          )
          foreach ($c in $cases) {
            $got = Get-Branch $c.over
            Write-Host ("  {0,-28} -> {1}" -f $c.name, $got)
            if ($got -notmatch [regex]::Escape($c.want)) {
              throw "logo mode '$($c.name)' drew '$got', expected '$($c.want)'"
            }
          }

          # A block art logo is a text file that fastfetch prints verbatim, so
          # --logo-width cannot shrink it the way it shrinks a sixel. An art too
          # wide for the room the frame leaves is dropped rather than allowed to
          # push the frame's corner off the window - and because the art is
          # pre-rendered at several sizes, "dropped" means a smaller render of
          # the same picture, or the frame alone when none of them fits either.
          # Every width is forced, so this does not depend on the runner's own
          # console size.
          $artProbe = Join-Path $env:TEMP 'logo-probe-art.ps1'
          $artFile = Join-Path $root 'arts\demo.art'
          $realArt = Get-Content -LiteralPath $artFile -Raw
          # 61 columns leaves room 10: nothing in the ladder fits, so the frame is
          # drawn on its own.
          Set-Content -LiteralPath $artFile -Value ('x' * 40) -NoNewline
          Set-Content -LiteralPath $artProbe -Value ($src.Replace('[Console]::WindowWidth', '61').Replace('[Console]::WindowHeight', '42'))
          $overWide = Get-Branch @{} $artProbe
          Write-Host ("  {0,-28} -> {1}" -f 'art wider than the room', $overWide)
          if ($overWide -notmatch [regex]::Escape('--logo none')) {
            throw "an over-wide block art drew '$overWide', expected the frame alone"
          }
          # 75 columns leaves room 24: too narrow for the 28-column art, so the
          # ladder's 24x21 render is drawn instead of nothing.
          Set-Content -LiteralPath $artProbe -Value ($src.Replace('[Console]::WindowWidth', '75').Replace('[Console]::WindowHeight', '42'))
          $smaller = Get-Branch @{} $artProbe
          Write-Host ("  {0,-28} -> {1}" -f 'art too wide, smaller step', $smaller)
          if ($smaller -notmatch [regex]::Escape('arts\demo-24x21.art')) {
            throw "a too-wide block art drew '$smaller', expected the ladder's 24x21 render"
          }
          Set-Content -LiteralPath $artFile -Value $realArt -NoNewline
          $artFits = Get-Branch @{}
          Write-Host ("  {0,-28} -> {1}" -f 'art that fits', $artFits)
          if ($artFits -notmatch [regex]::Escape('arts\demo.art')) {
            throw "a block art that fits drew '$artFits', expected the art"
          }

          # With no block art to fall back on, fastfetch's ASCII logo is the last
          # resort.
          Remove-Item -LiteralPath (Join-Path $root 'arts') -Recurse -Force
          $noArt = Get-Branch @{}
          Write-Host ("  {0,-28} -> {1}" -f 'conhost, no art at all', $noArt)
          if ($noArt -notmatch [regex]::Escape('--logo Windows11')) {
            throw "without art the launcher drew '$noArt', expected the built-in logo"
          }

          # A Windows Terminal tab that has no WT_SESSION - WT displaying a
          # console some other process created, an elevated shell, or a shell
          # whose environment was rebuilt - is still Windows Terminal, and
          # fastfetch says so because it reads the process tree. The env-only
          # check used to conclude "no image support" and draw block art, which
          # is how the same terminal produced a crisp logo in one window and a
          # pixelated one in the next.
          $hostProbe = Join-Path $env:TEMP 'logo-probe-host.ps1'
          Set-Content -LiteralPath $hostProbe -Value `
            $src.Replace('elseif (Test-WindowsTerminalHost) {', 'elseif ($true) {')
          $viaTree = Get-Branch @{} $hostProbe
          Write-Host ("  {0,-28} -> {1}" -f 'wt tab, WT_SESSION gone', $viaTree)
          if ($viaTree -notmatch [regex]::Escape('--logo-type raw')) {
            throw "a Windows Terminal tab without WT_SESSION drew '$viaTree', expected the sixel"
          }

          # It has to be a fallback, not a replacement: an editor opened from a
          # Windows Terminal tab keeps WindowsTerminal.exe in its process tree,
          # and that editor's own terminal still cannot draw sixel.
          $body  = Get-Content -LiteralPath $launcher -Raw
          $iCall = $body.IndexOf('elseif (Test-WindowsTerminalHost) {')
          $iCode = $body.IndexOf("TERM_PROGRAM -eq 'vscode'")
          $iGen  = $body.IndexOf('elseif ($env:TERM_PROGRAM) {')
          if ($body -notmatch 'function Test-WindowsTerminalHost') {
            throw 'the launcher cannot recognise a Windows Terminal host without WT_SESSION'
          }
          if ($iCall -lt 0 -or $iCode -lt 0 -or $iGen -lt 0 -or
              $iCode -gt $iCall -or $iCall -gt $iGen) {
            throw 'the process-tree check must sit between the named terminals and the generic TERM_PROGRAM fallback'
          }
          Write-Host 'host detection ok (process tree consulted, but only after the named terminals)'

          # --- the fetch has to fit the window it lands in --------------------
          # The logo is drawn beside a fixed-width frame, so the pair is wider
          # than most windows - and fastfetch does not know the frame is there.
          # A narrower window used to wrap the fetch over itself: the frame's
          # border on the next row, long values split in half, the logo
          # overlapped. The launcher now gives the logo only what is left after
          # the frame, and refuses to let fastfetch wrap at all.
          $calls = @($body -split "`n" | Where-Object { $_ -match '^\s*& \$Plan\.Exe' })
          if ($calls.Count -ne 1) { throw "expected one fastfetch invocation site, found $($calls.Count)" }
          if ($body -notmatch '--disable-linewrap') { throw 'the launcher never refuses line wrapping' }
          if ($body -notmatch '\$ffArgs \+= \$Plan\.Fit') { throw 'the draw does not refuse line wrapping' }
          if ($body -notmatch "'--logo', 'none'") {
            throw 'the launcher cannot drop the logo when the window is too narrow for it'
          }

          # Pin the arithmetic. The frame is 46 columns (BOX_WIDTH 44 plus two
          # corners), the configured logo is 28x24, and the logo gets whatever
          # is left: cols - 46 - 1 - 4. The 4 is fastfetch's own logo padding,
          # which sits between the logo and the text; without reserving it the
          # pair "fits" on paper while the frame's corner is still pushed three
          # columns off the edge - measured in a real 71-column window.
          $fitProbe = Join-Path $env:TEMP 'logo-probe-fit.ps1'
          $fitBase = $body.Replace('& $Plan.Exe @a',
                                   "Add-Content -LiteralPath `$env:FF_LOG -Value (`$a -join ' ')")
          if ($fitBase -match '& \$Plan\.Exe') { throw 'the launcher invocation was not swapped out for the fit probe' }

          # Room is cols - 46 (frame) - 1 - 4 (fastfetch's logo padding), and the
          # ladder is 28x24, 24x21, 20x17, 16x14, 12x11 for the 28x24 fixture.
          # Fitting means *choosing a smaller file*: --logo-width is the chosen
          # file's real cell count, never a number rewritten to fit, because a
          # number that disagrees with the raster is what put the fetch's text
          # inside the picture (text inside a sixel's cells tears it).
          $fitCases = @(
            @{ cols = 120; want = '--logo-width 28 --logo-height 24' },   # room 69 - as configured
            @{ cols =  80; want = '--logo-width 28 --logo-height 24' },   # room 29
            @{ cols =  75; want = '--logo-width 24 --logo-height 21' },   # room 24 - one step down
            @{ cols =  74; want = '--logo-width 20 --logo-height 17' },   # room 23 - and another
            @{ cols =  64; want = '--logo-width 12 --logo-height 11' },   # room 13
            @{ cols =  61; want = '--logo none' },                        # room 10 - nothing fits
            @{ cols =  59; want = '--logo none' }                         # room 8
          )
          foreach ($c in $fitCases) {
            Set-Content -LiteralPath $fitProbe -Value `
              ($fitBase.Replace('[Console]::WindowWidth', [string]$c.cols).Replace('[Console]::WindowHeight', '42'))
            # WT_SESSION so the sixel branch runs: that is the one that sizes the logo.
            $got = Get-Branch @{ WT_SESSION = 'ci' } $fitProbe
            Write-Host ("  window {0,3} cols         -> {1}" -f $c.cols, $got)
            if ($got -notmatch [regex]::Escape($c.want)) {
              throw "a $($c.cols)-column window drew '$got', expected '$($c.want)'"
            }
          }
          Write-Host 'window fitting ok (logo scaled to the room the frame leaves; wrapping refused)'

          # With no art and no image support, the fallback has to say where it
          # happened and how to override it - that silence is what made
          # "I set a logo and got a Windows logo" look like a broken app.
          Clear-Term
          $global:FastFetchStudioDrawn = $false
          $env:TERM_PROGRAM = 'vscode'
          $msg = & $probe *>&1 | Out-String
          if ($msg -notmatch 'no image support detected in the VS Code terminal') {
            throw "fallback did not name the terminal: $msg"
          }
          if ($msg -notmatch 'FASTFETCH_STUDIO_LOGO') {
            throw "fallback did not offer the override: $msg"
          }
          Write-Host 'logo mode ok (branches pinned; art fallback; fallback explains itself)'

      # The logo is a raster image anchored to the cells it was drawn over, so a
      # window resize - Alt+Enter (Windows Terminal's toggleFullscreen), F11,
      # dragging an edge, Ctrl+scroll zooming the font - reflows the text under it
      # and tears the picture into bands. There is no resize event to subscribe
      # to on Windows (ReadConsoleInput is the only signal and PSReadLine owns
      # that buffer), so the prompt notices the grid changed and draws the same
      # fetch again at the new size, erasing the torn copy first. It must never
      # re-roll the theme or the picture: a resize is not a new shell.
      - name: The fetch repairs itself after a window resize
        shell: pwsh
        run: |
          python -c "import app; app.generate_launcher({'logWidth':28,'logHeight':24})"
          $root = Join-Path $env:USERPROFILE '.config\fastfetch'
          $launcher = Join-Path $root 'fastfetch-random.ps1'
          $body = Get-Content -LiteralPath $launcher -Raw
          if ($body -notmatch 'Install-FFSResizeGuard') { throw 'the launcher has no resize guard' }
          if ($body -notmatch '\$redrawOnResize = \$true') { throw 'the guard is not on by default' }
          Write-Host 'launcher carries the resize guard'

          foreach ($d in 'themes', 'sixels', 'gui', 'arts') {
            New-Item -ItemType Directory -Path (Join-Path $root $d) -Force | Out-Null
          }
          Set-Content -LiteralPath (Join-Path $root 'themes\theme-01.jsonc') -Value '{"modules":[]}'
          python tools/make-logo-fixtures.py --sixel-dir (Join-Path $root 'sixels') --art-dir (Join-Path $root 'arts') --name demo
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'fastfetch.exe') -Value '' -NoNewline
          $state = Join-Path $root 'gui\studio-state.json'
          $log   = Join-Path $env:TEMP 'resize-log.txt'

          function New-ResizeProbe([int]$FirstCols, [string]$Then) {
            $src = Get-Content -LiteralPath $launcher -Raw
            # Pin the size the first draw sees, log every draw, and log the
            # erase - a torn image can only be removed by erasing its cells, so
            # a repair that skips it would draw a second fetch under a broken one.
            $src = $src.Replace('$c = [int][Console]::WindowWidth; $r = [int][Console]::WindowHeight',
                                ('$c = ' + $FirstCols + '; $r = 40'))
            $src = $src.Replace('& $Plan.Exe @a',
                                "Add-Content -LiteralPath `$env:FF_LOG -Value (`$a -join ' ')")
            $src = $src.Replace('try { [Console]::Clear() } catch { }',
                                "Add-Content -LiteralPath `$env:FF_LOG -Value 'erase'")
            # Appended last, so only the size polled *after* the first draw
            # changes. That is the resize; the first draw still sees FirstCols.
            $src += "`nfunction global:Get-FFSGrid { return @($Then) }`n"
            $out = Join-Path $env:TEMP 'resize-probe.ps1'
            Set-Content -LiteralPath $out -Value $src
            return $out
          }

          function Resized([string]$StateJson, [string]$Then = '64, 30') {
            Set-Content -LiteralPath $state -Value $StateJson
            $probe = New-ResizeProbe -FirstCols 120 -Then $Then
            $env:FF_LOG = $log
            $env:WT_SESSION = 'ci'
            # A fresh shell: the plan, the guard and the captured prompt are all
            # per session, and the runner is one long-lived pwsh.
            $global:FastFetchStudioDrawn = $false
            $global:FFSGuardInstalled = $false
            $global:FFSPlan = $null
            $global:FFSPrevPrompt = $null
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            & $probe *>&1 | Out-Null
            $before = @(Get-Content -LiteralPath $log)
            $shown  = prompt
            $after  = @(Get-Content -LiteralPath $log)
            $null   = prompt
            $again  = @(Get-Content -LiteralPath $log)
            Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue
            return @{ Before = $before; After = $after; Loop = $again.Count - $after.Count; Prompt = $shown }
          }

          $on  = '{"randomLogo":true,"randomTheme":true,"logWidth":28,"logHeight":24,"redrawOnResize":true}'
          $off = '{"randomLogo":true,"randomTheme":true,"logWidth":28,"logHeight":24,"redrawOnResize":false}'

          # 120 columns -> 64: the logo is re-fitted to the room that leaves
          # (28x24 -> the 12x11 step of the ladder), the torn copy is erased, and
          # the theme and picture are the same ones.
          $r = Resized $on
          $draws = @($r.After | Where-Object { $_ -match '--logo' })
          Write-Host "  after a resize -> $($draws -join ' | ')"
          if ($draws.Count -ne 2) { throw "expected the first draw plus one repair, got $($draws.Count)" }
          if ($draws[0] -notmatch '--logo-width 28 --logo-height 24') { throw "first draw wrong: $($draws[0])" }
          if (-not ($r.After | Where-Object { $_ -eq 'erase' })) { throw 'the torn copy was never erased' }
          # 64 columns leaves room 13, so the repair draws the 12x11 step of the
          # ladder - a different file, the same picture.
          if ($draws[1] -notmatch '--logo-width 12 --logo-height 11') { throw "the repair drew the wrong size: $($draws[1])" }
          if (($draws[0] -split ' --')[0] -ne ($draws[1] -split ' --')[0]) {
            throw 'the theme changed on resize; a resize is not a new shell'
          }
          $img0 = ([regex]::Match($draws[0], 'sixels\\[^ ]*\.sixel')).Value
          $img1 = ([regex]::Match($draws[1], 'sixels\\[^ ]*\.sixel')).Value
          if (-not $img0) { throw "the first draw did not use the sixel fixture: $($draws[0])" }
          # The ladder means the repair may pick a smaller *file* of the same
          # picture. What must not change is which picture it is.
          if (($img0 -replace '-\d+x\d+\.sixel$', '.sixel') -ne ($img1 -replace '-\d+x\d+\.sixel$', '.sixel')) {
            throw "the picture changed on resize: $img0 -> $img1"
          }
          if ($r.Loop -ne 0) { throw "the fetch was redrawn again with no resize ($($r.Loop) extra lines)" }
          Write-Host 'resize ok (same theme, same picture, re-fitted, erased, no loop)'

          # A shell that already has a prompt of its own keeps it.
          function global:prompt { 'USER-PROMPT>' }
          $global:FFSPrevPrompt = $null
          $r2 = Resized $on
          if ($r2.Prompt -notmatch 'USER-PROMPT>') { throw "the user's prompt was replaced: $($r2.Prompt)" }
          if (@($r2.After | Where-Object { $_ -match '--logo-width 12' }).Count -ne 1) {
            throw 'a shell with its own prompt did not get the repair'
          }
          Write-Host 'chained prompt ok (repair still runs, prompt text untouched)'

          # Off means off: no guard is installed, so the screen is never touched.
          $r3 = Resized $off
          $draws3 = @($r3.After | Where-Object { $_ -match '--logo' })
          if ($draws3.Count -ne 1) { throw "the fetch was redrawn with the setting off: $($r3.After -join ' | ')" }
          Write-Host 'redraw off ok (the screen is never touched)'

          # The switch is baked in as well as read from the state file, so a
          # launcher that has never met a state file still knows the default.
          python -c "import app; app.generate_launcher({'logWidth':28,'logHeight':24,'redrawOnResize':False})"
          $offBody = Get-Content -LiteralPath $launcher -Raw
          if ($offBody -notmatch '\$redrawOnResize = \$false') { throw 'redrawOnResize:false did not render as $false' }
          Write-Host 'guard default ok (baked in, overridable from the state file)'

          # Leave the default launcher behind, as the other steps expect it.
          python -c "import app; app.generate_launcher({'logWidth':28,'logHeight':24})"

      # "Preview in terminal" used to fail with
      #   Error 2147942402 (0x80070002) when launching `" & "$env:USERPROFILE\..."`
      # because the payload was a `powershell -Command "$env:WT_SESSION=..; & ff"`
      # one-liner, and Windows Terminal splits its command line on ';' even
      # inside a quoted argument. It cut the line at the ';' and tried to launch
      # the second half - which began with '&' - as a program. The payload is a
      # generated file now, so the wt line has nothing to split on.
      - name: Preview command line has nothing for wt to split
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE '.config\fastfetch'
          # write_preview_script refuses to build anything without a theme.
          $themes = Join-Path $root 'themes'
          New-Item -ItemType Directory -Path $themes -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $themes 'theme-01.jsonc') -Value '{"modules":[]}'
          python -c "import app; app.write_preview_script({'logWidth':28,'logHeight':24,'gallery':[]}, '')"

          $script = Join-Path $root 'gui\preview.ps1'
          if (-not (Test-Path -LiteralPath $script)) { throw 'no preview.ps1 was generated' }

          # The markers let a later run find and replace the file without
          # disturbing anything a user added around it.
          $body = Get-Content -LiteralPath $script -Raw
          if ($body -notmatch '# >>> FastFetch Studio :: preview >>>') { throw 'preview.ps1 has no opening marker' }
          if ($body -notmatch '# <<< FastFetch Studio :: preview <<<') { throw 'preview.ps1 has no closing marker' }

          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$errs)
          if (@($errs).Count) { throw "preview.ps1 has syntax errors: $($errs[0].Message)" }
          Write-Host 'preview.ps1 parses cleanly'

          # The invariant. A ';' anywhere on the wt line - including inside an
          # argument - is exactly what broke the preview.
          $cmd = @(python -c "import app; print('\n'.join(app.preview_argv(app.PREVIEW_SCRIPT)))")
          if ($cmd.Count -lt 6) { throw "preview_argv produced no command line: $cmd" }
          $bad = @($cmd | Where-Object { $_ -like '*;*' })
          if ($bad.Count) { throw "the preview command line contains a ';': $($bad -join ' | ')" }
          Write-Host 'preview command line carries no semicolon'

          # -NoExit must precede -File, or PowerShell hands it to the script as an
          # argument instead of reading it and the window closes on fastfetch's exit.
          $joined = $cmd -join ' '
          if ($joined -notmatch '-NoExit\s+-NoProfile\s+-ExecutionPolicy\s+Bypass\s+-File') {
            throw "-NoExit is not positioned before -File: $joined"
          }
          if ($joined -match 'wt\.exe.*-Command') { throw "preview still uses -Command: $joined" }
          Write-Host '-NoExit sits before -File'

          # Behaviour: swap the draw for a log write of the arguments it was
          # handed, then check the branch each way of launching the script takes.
          $probe = Join-Path $env:TEMP 'preview-probe.ps1'
          $log = Join-Path $env:TEMP 'preview-log.txt'
          $src = Get-Content -LiteralPath $script -Raw
          $src = $src.Replace('& $Plan.Exe @a',
                              "Add-Content -LiteralPath `$env:FF_LOG -Value (`$a -join ' ')")
          if ($src -match '& \$Plan\.Exe') { throw 'the preview invocation was not swapped out for the probe' }

          # The draw has to refuse line wrapping: fastfetch cannot know a frame
          # is drawn beside the text, so a row longer than the window wraps and
          # takes the frame's border with it.
          if ($body -notmatch '\$ffArgs \+= \$Plan\.Fit') {
            throw 'the preview draw does not refuse wrapping'
          }
          Set-Content -LiteralPath $probe -Value $src

          function Assert-Preview([string]$name, [string]$got, [string]$want) {
            Write-Host ("  {0,-24} -> {1}" -f $name, $got)
            if ($got -notmatch [regex]::Escape($want)) {
              throw "preview drew '$got' for '$name', expected '$want'"
            }
          }

          # fastfetch is not installed on the runner, so the script would bail out
          # before reaching any branch. Point it at a file that exists.
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'fastfetch.exe') -Value '' -NoNewline

          $sixel = Join-Path $root 'gui\preview.sixel'
          # image_path was '' above, so art_key() gives the fallback name 'img'.
          $arts = Join-Path $root 'arts'
          New-Item -ItemType Directory -Path $arts -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $arts 'img.art') -Value 'art' -NoNewline

          function Get-PreviewBranch([switch]$BlockArt, [string]$Script = $probe) {
            $env:FF_LOG = $log
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            # Splat, don't pass a string: PowerShell does not re-read a variable's
            # value as a parameter name, so "& $probe $extra" would silently drop
            # the switch and every case would look like the default branch.
            $p = @{}
            if ($BlockArt) { $p['BlockArt'] = $true }
            & $Script @p *>&1 | Out-Null
            if (Test-Path -LiteralPath $log) { return (Get-Content -LiteralPath $log) -join ',' }
            return 'none'
          }

          # A real ladder in gui\: the preview reads the raster out of the file it
          # is about to draw, exactly as the launcher does.
          python tools/make-logo-fixtures.py --sixel-dir (Join-Path $root 'gui') --name preview
          Assert-Preview 'sixel present' (Get-PreviewBranch) '--logo-type raw'

          # No sixel (Pillow missing, say) must still show the picture as block art.
          Remove-Item -LiteralPath $sixel -Force
          Assert-Preview 'no sixel, art available' (Get-PreviewBranch) 'arts\img.art'

          # -BlockArt is what the no-wt.exe console fallback passes: a bare console
          # cannot draw sixel, so it must go straight to the art even if one exists.
          python tools/make-logo-fixtures.py --sixel-dir (Join-Path $root 'gui') --name preview
          Assert-Preview '-BlockArt' (Get-PreviewBranch -BlockArt) 'arts\img.art'

          # A text logo cannot be scaled by --logo-width, so an art wider than the
          # room the frame leaves has to be dropped: drawing it pushes the frame
          # off the edge. Pinned by forcing the room and using an over-wide art,
          # rather than by guessing the runner's window width.
          $wideArtProbe = Join-Path $env:TEMP 'preview-probe-wide.ps1'
          $artFile = Join-Path $arts 'img.art'
          Set-Content -LiteralPath $artFile -Value ('x' * 40) -NoNewline
          Set-Content -LiteralPath $wideArtProbe -Value `
            $src.Replace('$room = $cols -', '$room = 61 -')
          Assert-Preview 'art wider than the room' (Get-PreviewBranch -BlockArt -Script $wideArtProbe) '--logo none'
          Set-Content -LiteralPath $artFile -Value 'art' -NoNewline

          # Nothing to draw with at all: fastfetch's own ASCII logo.
          Remove-Item -LiteralPath $arts -Recurse -Force
          Remove-Item -LiteralPath $sixel -Force
          Assert-Preview 'no sixel, no art' (Get-PreviewBranch) '--logo Windows11'

          # A window too narrow for the logo beside the frame: the logo has to go,
          # and the frame is drawn alone. Drawing the picture anyway is exactly
          # what wrapped the preview over itself. Pinned by forcing the leftover
          # room negative rather than by guessing the runner's window width.
          $narrow = Join-Path $env:TEMP 'preview-probe-narrow.ps1'
          python tools/make-logo-fixtures.py --sixel-dir (Join-Path $root 'gui') --name preview
          Set-Content -LiteralPath $narrow -Value `
            $src.Replace('$room = $cols -', '$room = 0 -')
          Assert-Preview 'window too narrow' (Get-PreviewBranch -Script $narrow) '--logo none'

          # The preview must leave the window the size Windows Terminal opened it
          # at. Resizing the console host does work, but Windows Terminal
          # persists the last window size it closed, so widening the preview
          # silently rewrites the width of every terminal opened afterwards.
          # Tried in v1.1.11 and deliberately reverted in v1.1.12.
          # Comment lines are dropped first: the template explains *why* it does
          # not resize, and naming the API there must not trip its own guard.
          $code = ($body -split "`n" | Where-Object { $_ -notmatch '^\s*#' }) -join "`n"
          if ($code -match 'SetWindowSize') {
            throw 'preview.ps1 resizes the window; that rewrites the size of every later terminal'
          }
          Write-Host 'preview ok (file payload; branches pinned; window size untouched)'

      # The preview window is the one a user resizes on purpose, so a torn logo
      # there is the most visible version of this bug. It carries the same guard
      # (shared verbatim with the launcher), and this pins the repair end to end -
      # including the block-art branch, whose logo has to be *measured* by a
      # function call made after the script's own scope is gone.
      - name: The preview window repairs itself after a resize
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE '.config\fastfetch'
          foreach ($d in 'themes', 'gui', 'arts') {
            New-Item -ItemType Directory -Path (Join-Path $root $d) -Force | Out-Null
          }
          Set-Content -LiteralPath (Join-Path $root 'themes\theme-01.jsonc') -Value '{"modules":[]}'
          # image_path '' below, so art_key() gives the fallback name 'img'.
          Set-Content -LiteralPath (Join-Path $root 'arts\img.art') -Value 'art' -NoNewline
          python -c "import app; app.write_preview_script({'logWidth':28,'logHeight':24,'gallery':[]}, '')"
          $script = Join-Path $root 'gui\preview.ps1'
          if (-not (Test-Path -LiteralPath $script)) { throw 'no preview.ps1 was generated' }
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'fastfetch.exe') -Value '' -NoNewline

          # No sixel - Pillow missing on the user's machine, say - so the block
          # art is the logo, and drawing it again means measuring it again. The
          # branch step above leaves a real ladder in gui\, and a 120-column
          # window holds the full size: drop it so this step pins the art branch
          # it is about, whatever ran before.
          Get-ChildItem -LiteralPath (Join-Path $root 'gui') -Filter 'preview-*.sixel' -File |
            Remove-Item -Force
          Remove-Item -LiteralPath (Join-Path $root 'gui\preview.sixel') -Force -ErrorAction SilentlyContinue

          $log = Join-Path $env:TEMP 'preview-resize-log.txt'
          $env:FF_LOG = $log
          $probe = Join-Path $env:TEMP 'preview-resize-probe.ps1'
          $src = Get-Content -LiteralPath $script -Raw
          if ($src -notmatch 'Install-FFSResizeGuard') { throw 'preview.ps1 has no resize guard' }
          $src = $src.Replace('$c = [int][Console]::WindowWidth; $r = [int][Console]::WindowHeight',
                              '$c = 120; $r = 40')
          $src = $src.Replace('& $Plan.Exe @a',
                              "Add-Content -LiteralPath `$env:FF_LOG -Value (`$a -join ' ')")
          $src = $src.Replace('try { [Console]::Clear() } catch { }',
                              "Add-Content -LiteralPath `$env:FF_LOG -Value 'erase'")
          # The resize: only the size polled after the first draw changes.
          $src += "`nfunction global:Get-FFSGrid { return @(61, 30) }`n"
          Set-Content -LiteralPath $probe -Value $src

          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $out = & $probe *>&1
          $null = prompt
          $lines = @(Get-Content -LiteralPath $log)
          $draws = @($lines | Where-Object { $_ -match '--logo' })
          Write-Host "  after a resize -> $($draws -join ' | ')"
          if ($draws.Count -ne 2) { throw "the preview did not repair itself: $($lines -join ' | ')" }
          if ($draws[0] -notmatch 'img\.art') { throw "the preview drew the wrong logo first: $($draws[0])" }
          if (-not ($lines | Where-Object { $_ -eq 'erase' })) {
            throw 'the preview drew over the torn copy instead of erasing it'
          }
          if (@($out | Where-Object { $_ -match 'close this window' }).Count -ne 1) {
            throw 'the repair repeated the closing line'
          }
          Write-Host 'preview resize ok (art logo re-measured after the script scope was gone)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastFetchStudio-exe
          path: dist/FastFetchStudio.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FastFetchStudio.exe
          generate_release_notes: true

  verify-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A fresh runner is the closest thing to the "new user" case setup.ps1 targets:
      # no fastfetch, no profile, both PowerShell 5.1 and 7 installed.
      - name: Run setup.ps1 on a clean machine
        shell: pwsh
        run: ./setup.ps1

      - name: fastfetch is installed and on the user PATH
        shell: pwsh
        run: |
          $ff = Join-Path $env:USERPROFILE '.local\bin\fastfetch.exe'
          if (-not (Test-Path $ff)) { throw "fastfetch.exe was not installed at $ff" }
          $version = (& $ff --version) -join ' '
          Write-Host "version: $version"
          if ($version -notmatch '^fastfetch ') { throw "unexpected --version output: $version" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike '*.local\bin*') { throw "install dir missing from the user PATH: $userPath" }

      # End-to-end icon check: this job has a real fastfetch, so the guard can
      # render the generated config and assert every keyed row actually draws a
      # glyph - not just that the config asks for one.
      - name: Every module renders an icon
        run: python app.py --smoke-icons

      - name: Exactly one hook block per profile
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $paths = @(
            (Join-Path $docs 'WindowsPowerShell\Microsoft.PowerShell_profile.ps1'),
            (Join-Path $docs 'PowerShell\Microsoft.PowerShell_profile.ps1')
          )
          $found = 0
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { Write-Host "absent (shell not installed): $p"; continue }
            $n = ([regex]::Matches((Get-Content $p -Raw), [regex]::Escape('# >>> FastFetch Studio'))).Count
            if ($n -ne 1) { throw "$p contains $n hook blocks, expected exactly 1" }
            Write-Host "ok, exactly one hook block: $p"
            $found++
          }
          if ($found -eq 0) { throw 'setup.ps1 did not write any profile' }

      - name: Re-running changes nothing (idempotency)
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $before = @(Get-ChildItem $docs -Recurse -Filter '*.bak-*' -ErrorAction SilentlyContinue).Count
          $out = ./setup.ps1 *>&1 | Out-String
          Write-Host $out
          $after = @(Get-ChildItem $docs -Recurse -Filter '*.bak-*' -ErrorAction SilentlyContinue).Count
          if ($out -notmatch 'already installed') { throw 'second run did not detect the existing binary' }
          if ($out -notmatch 'already configured') { throw 'second run did not detect the existing hook' }
          if ($after -ne $before) { throw "second run created backup files ($before -> $after); it should have written nothing" }

      - name: A new shell actually runs the hook
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.config\fastfetch'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Set-Content -Path (Join-Path $dir 'fastfetch-random.ps1') -Value 'Write-Output "LAUNCHER_RAN"'
          $child = pwsh -NoLogo -ExecutionPolicy Bypass -Command 'Write-Output "CHILD_DONE"' 2>&1 | Out-String
          Write-Host $child
          if ($child -notmatch 'CHILD_DONE') { throw 'the child shell did not run' }
          if ($child -notmatch 'LAUNCHER_RAN') { throw 'the profile hook did not call fastfetch-random.ps1' }

      - name: An existing fastfetch call is never duplicated
        shell: pwsh
        run: |
          $probe = Join-Path $env:TEMP 'probe-profile.ps1'
          Set-Content -Path $probe -Value '& "$env:USERPROFILE\.config\fastfetch\fastfetch-random.ps1"'
          $out = ./setup.ps1 -ProfilePath $probe -SkipDownload -SkipPath *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'left untouched') { throw 'setup.ps1 did not report the pre-existing call' }
          if ((Get-Content $probe -Raw) -match 'FastFetch Studio ::') { throw 'setup.ps1 wrote a hook into a profile that already had one' }

      - name: Uninstall removes the hook
        shell: pwsh
        run: |
          ./setup.ps1 -Uninstall
          $docs = [Environment]::GetFolderPath('MyDocuments')
          foreach ($p in @((Join-Path $docs 'WindowsPowerShell\Microsoft.PowerShell_profile.ps1'),
                           (Join-Path $docs 'PowerShell\Microsoft.PowerShell_profile.ps1'))) {
            if ((Test-Path $p) -and ((Get-Content $p -Raw) -match 'FastFetch Studio ::')) {
              throw "hook still present in $p"
            }
          }
          Write-Host 'uninstall clean'
