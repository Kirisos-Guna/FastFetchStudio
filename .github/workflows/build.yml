name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name FastFetchStudio
          --hidden-import tkinter --hidden-import PIL --hidden-import PIL.ImageTk
          --collect-submodules PIL app.py

      - name: Smoke test (headless selftest)
        run: .\dist\FastFetchStudio.exe --selftest

      - name: Smoke test (GUI build + apply)
        run: .\dist\FastFetchStudio.exe --smoke-gui

      # Tk does not clamp the canvas origin when the scroll region is shorter
      # than the viewport, so a wheel-up nudge with nothing to scroll to used to
      # push the tab content down the card behind a blank band. Guarded because
      # it is invisible to yview() and trivial to reintroduce.
      - name: Scroll origin stays inside the scroll region
        run: .\dist\FastFetchStudio.exe --smoke-scroll

      # Icons come from fastfetch's per-type keyIcon default, not from a glyph
      # typed into each key. A hand-maintained glyph list drifted and left 6 of
      # 14 rows label-only. This runner has no fastfetch, so only the config
      # shape is checked here; verify-setup does the render check.
      - name: Every module has an icon
        run: .\dist\FastFetchStudio.exe --smoke-icons

      # The launcher runs on every shell start, so its behaviour is worth
      # pinning: it must draw fastfetch exactly once, and 'once per day' must
      # actually throttle. Both were broken before v1.1.5.
      - name: Launcher draws fastfetch exactly once
        shell: pwsh
        run: |
          python -c "import app; app.generate_launcher({'logWidth':28,'logHeight':24})"
          $launcher = Join-Path $env:USERPROFILE '.config\fastfetch\fastfetch-random.ps1'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'app.py did not write a launcher' }

          # Fixtures: the image branch only runs when a .sixel exists, and the
          # retry-on-failure only happens inside that branch. Without one, every
          # case takes the no-image path and the retry is never exercised.
          $sixels = Join-Path $env:USERPROFILE '.config\fastfetch\sixels'
          New-Item -ItemType Directory -Path $sixels -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $sixels 'demo.sixel') -Value 'x' -NoNewline
          $themes = Join-Path $env:USERPROFILE '.config\fastfetch\themes'
          New-Item -ItemType Directory -Path $themes -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $themes 'theme-01.jsonc') -Value '{"modules":[]}'

          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($launcher, [ref]$null, [ref]$errs)
          if (@($errs).Count) { throw "launcher has syntax errors: $($errs[0].Message)" }
          Write-Host 'launcher parses cleanly'

          # Replace each real invocation with a log write that also models the
          # exe's exit code. Swapping in a bare cmdlet would leave $LASTEXITCODE
          # unset, and "$null -ne 0" is TRUE in PowerShell - which is precisely
          # how the fallback came to fire on a successful run.
          $probe = Join-Path $env:TEMP 'launcher-probe.ps1'
          $inv   = Join-Path $env:TEMP 'launcher-inv.txt'
          $log   = "Add-Content -LiteralPath '$inv' -Value 'run'`n`$global:LASTEXITCODE = [int]`$env:FF_RC"
          $src = Get-Content -LiteralPath $launcher -Raw
          $src = $src.Replace('& $ffExe @themeArg @logoArg', $log)
          $src = $src.Replace("& `$ffExe @themeArg --logo 'Windows11' @colorArgs", $log)
          Set-Content -LiteralPath $probe -Value $src

          function Count-Runs([int]$rc) {
            $env:FF_RC = $rc
            Remove-Item -LiteralPath $inv -Force -ErrorAction SilentlyContinue
            & $probe | Out-Null
            if (Test-Path -LiteralPath $inv) { return @(Get-Content -LiteralPath $inv).Count }
            return 0
          }

          # The runner has no fastfetch. That is the fresh-machine case the
          # launcher is meant to explain rather than fail silently on, so pin
          # PATH to System32 and assert it draws nothing but does speak up.
          Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue
          Remove-Item Env:\TERM_PROGRAM -ErrorAction SilentlyContinue
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:FF_RC = 0
          Remove-Item -LiteralPath $inv -Force -ErrorAction SilentlyContinue
          # Write-Host goes to the information stream, so 2>&1 would capture
          # nothing; *>&1 is what actually surfaces the message.
          $msg = & $probe *>&1 | Out-String
          $missing = if (Test-Path -LiteralPath $inv) { @(Get-Content -LiteralPath $inv).Count } else { 0 }
          $env:PATH = $savedPath
          if ($missing -ne 0) { throw "launcher drew $missing times with no fastfetch installed" }
          if ($msg -notmatch 'was not found') { throw "missing fastfetch produced no explanation: $msg" }
          Write-Host 'missing-fastfetch path ok (0 invocations, explained)'

          # Give it a stub so $ffExe resolves. The probe never executes it -
          # the invocations are replaced by log writes - it only has to exist.
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'fastfetch.exe') -Value '' -NoNewline

          foreach ($case in @('conhost', 'windows-terminal')) {
            if ($case -eq 'windows-terminal') { $env:WT_SESSION = 'ci' }
            else { Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue }
            Remove-Item Env:\TERM_PROGRAM -ErrorAction SilentlyContinue
            $n = Count-Runs 0
            Write-Host "$case -> $n invocation(s)"
            if ($n -ne 1) { throw "launcher invoked fastfetch $n times in the '$case' case; must be exactly 1" }
          }

          # A failing image attempt retries exactly once; the no-image path has
          # no retry at all.
          $env:WT_SESSION = 'ci'
          $failImg = Count-Runs 1
          if ($failImg -ne 2) { throw "failed image attempt drew $failImg times, expected 2 (try + retry)" }
          Remove-Item Env:\WT_SESSION -ErrorAction SilentlyContinue
          $failPlain = Count-Runs 1
          if ($failPlain -ne 1) { throw "conhost fallback drew $failPlain times, expected 1" }
          Write-Host "retry ok (image=$failImg conhost=$failPlain)"

          # 'once per day' must write its day stamp and then hold for the rest of the day.
          $gui = Join-Path $env:USERPROFILE '.config\fastfetch\gui'
          New-Item -ItemType Directory -Path $gui -Force | Out-Null
          $stamp = Join-Path $gui '.last-random-run'
          Set-Content -LiteralPath (Join-Path $gui 'studio-state.json') -Value '{"frequency":"daily"}'
          Remove-Item -LiteralPath $stamp -Force -ErrorAction SilentlyContinue
          $first = Count-Runs 0
          if ($first -ne 1) { throw "daily run drew $first times, expected 1" }
          if (-not (Test-Path -LiteralPath $stamp)) { throw 'daily run did not write the day stamp' }
          $second = Count-Runs 0
          if ($second -ne 0) { throw "daily frequency drew again the same day ($second invocations)" }
          Write-Host "daily ok (first=$first second=$second)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastFetchStudio-exe
          path: dist/FastFetchStudio.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FastFetchStudio.exe
          generate_release_notes: true

  verify-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A fresh runner is the closest thing to the "new user" case setup.ps1 targets:
      # no fastfetch, no profile, both PowerShell 5.1 and 7 installed.
      - name: Run setup.ps1 on a clean machine
        shell: pwsh
        run: ./setup.ps1

      - name: fastfetch is installed and on the user PATH
        shell: pwsh
        run: |
          $ff = Join-Path $env:USERPROFILE '.local\bin\fastfetch.exe'
          if (-not (Test-Path $ff)) { throw "fastfetch.exe was not installed at $ff" }
          $version = (& $ff --version) -join ' '
          Write-Host "version: $version"
          if ($version -notmatch '^fastfetch ') { throw "unexpected --version output: $version" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike '*.local\bin*') { throw "install dir missing from the user PATH: $userPath" }

      # End-to-end icon check: this job has a real fastfetch, so the guard can
      # render the generated config and assert every keyed row actually draws a
      # glyph - not just that the config asks for one.
      - name: Every module renders an icon
        run: python app.py --smoke-icons

      - name: Exactly one hook block per profile
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $paths = @(
            (Join-Path $docs 'WindowsPowerShell\Microsoft.PowerShell_profile.ps1'),
            (Join-Path $docs 'PowerShell\Microsoft.PowerShell_profile.ps1')
          )
          $found = 0
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { Write-Host "absent (shell not installed): $p"; continue }
            $n = ([regex]::Matches((Get-Content $p -Raw), [regex]::Escape('# >>> FastFetch Studio'))).Count
            if ($n -ne 1) { throw "$p contains $n hook blocks, expected exactly 1" }
            Write-Host "ok, exactly one hook block: $p"
            $found++
          }
          if ($found -eq 0) { throw 'setup.ps1 did not write any profile' }

      - name: Re-running changes nothing (idempotency)
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $before = @(Get-ChildItem $docs -Recurse -Filter '*.bak-*' -ErrorAction SilentlyContinue).Count
          $out = ./setup.ps1 *>&1 | Out-String
          Write-Host $out
          $after = @(Get-ChildItem $docs -Recurse -Filter '*.bak-*' -ErrorAction SilentlyContinue).Count
          if ($out -notmatch 'already installed') { throw 'second run did not detect the existing binary' }
          if ($out -notmatch 'already configured') { throw 'second run did not detect the existing hook' }
          if ($after -ne $before) { throw "second run created backup files ($before -> $after); it should have written nothing" }

      - name: A new shell actually runs the hook
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.config\fastfetch'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Set-Content -Path (Join-Path $dir 'fastfetch-random.ps1') -Value 'Write-Output "LAUNCHER_RAN"'
          $child = pwsh -NoLogo -ExecutionPolicy Bypass -Command 'Write-Output "CHILD_DONE"' 2>&1 | Out-String
          Write-Host $child
          if ($child -notmatch 'CHILD_DONE') { throw 'the child shell did not run' }
          if ($child -notmatch 'LAUNCHER_RAN') { throw 'the profile hook did not call fastfetch-random.ps1' }

      - name: An existing fastfetch call is never duplicated
        shell: pwsh
        run: |
          $probe = Join-Path $env:TEMP 'probe-profile.ps1'
          Set-Content -Path $probe -Value '& "$env:USERPROFILE\.config\fastfetch\fastfetch-random.ps1"'
          $out = ./setup.ps1 -ProfilePath $probe -SkipDownload -SkipPath *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'left untouched') { throw 'setup.ps1 did not report the pre-existing call' }
          if ((Get-Content $probe -Raw) -match 'FastFetch Studio ::') { throw 'setup.ps1 wrote a hook into a profile that already had one' }

      - name: Uninstall removes the hook
        shell: pwsh
        run: |
          ./setup.ps1 -Uninstall
          $docs = [Environment]::GetFolderPath('MyDocuments')
          foreach ($p in @((Join-Path $docs 'WindowsPowerShell\Microsoft.PowerShell_profile.ps1'),
                           (Join-Path $docs 'PowerShell\Microsoft.PowerShell_profile.ps1'))) {
            if ((Test-Path $p) -and ((Get-Content $p -Raw) -match 'FastFetch Studio ::')) {
              throw "hook still present in $p"
            }
          }
          Write-Host 'uninstall clean'
