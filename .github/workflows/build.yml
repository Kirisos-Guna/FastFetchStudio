name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name FastFetchStudio
          --hidden-import tkinter --hidden-import PIL --hidden-import PIL.ImageTk
          --collect-submodules PIL app.py

      - name: Smoke test (headless selftest)
        run: .\dist\FastFetchStudio.exe --selftest

      - name: Smoke test (GUI build + apply)
        run: .\dist\FastFetchStudio.exe --smoke-gui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastFetchStudio-exe
          path: dist/FastFetchStudio.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FastFetchStudio.exe
          generate_release_notes: true
